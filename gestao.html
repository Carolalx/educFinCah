<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestão Financeira Doméstica</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body class="gestao">

  <header class="app-header">
    <div class="brand">
      <div class="logo">CA</div>
      <div>
        <h1>Gestão Financeira</h1>
        <div style="font-size:12px;color:rgba(230,238,241,0.7)">Resumo rápido das suas contas</div>
      </div>
    </div>

    <nav class="main-nav">
      <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
      <a href="gestao.html"><i class="fa-solid fa-chart-pie"></i> Gestão</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <form id="gestaoForm" autocomplete="off">

        <h2>RECEITAS</h2>
        <div class="input-group"><label>Salário</label><input id="salario" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="input-group"><label>Bônus</label><input id="bonus" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="input-group"><label>Extras</label><input id="extras" type="number" min="0" step="0.01" value="0">
        </div>

        <h2>SIMULAÇÃO (RENDA)</h2>
        <div class="input-group">
          <label><input type="radio" name="simulacao" value="individual" checked> INDIVIDUAL</label>
          <label><input type="radio" name="simulacao" value="familiar"> FAMILIAR</label>
        </div>

        <h2>DESPESAS</h2>
        <hr>
        <div class="input-group"><label>Moradia</label><input id="moradia" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="input-group"><label>Luz</label><input id="luz" type="number" min="0" step="0.01" value="0"></div>
        <div class="input-group"><label>Água</label><input id="agua" type="number" min="0" step="0.01" value="0"></div>
        <div class="input-group"><label>Mercado</label><input id="mercado" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="input-group"><label>Farmácia</label><input id="farmacia" type="number" min="0" step="0.01"
            value="0"></div>
        <div class="input-group"><label>Internet</label><input id="internet" type="number" min="0" step="0.01"
            value="0"></div>
        <div class="input-group"><label>Locomoção (Combustível, Ônibus, Motorista por app)</label><input id="locomocao"
            type="number" min="0" step="0.01" value="0"></div>
        <div class="input-group"><label>Cartão de Crédito</label><input id="cartaoCredito" type="number" min="0"
            step="0.01" value="0"></div>
        <div class="input-group"><label>Educação</label><input id="educacao" type="number" min="0" step="0.01"
            value="0"></div>
        <div class="input-group"><label>Lazer</label><input id="lazer" type="number" min="0" step="0.01" value="0">
        </div>
        <div class="input-group"><label>Investimentos</label><input id="investimentos" type="number" min="0" step="0.01"
            value="0"></div>

        <button class="primary" type="submit"><i class="fa-solid fa-calculator"></i> CALCULAR</button>
      </form>

      <button id="btnVoltarIndex" class="ghost" style="margin-top:12px">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
      </button>

      <!-- SALDO -->
      <h3 style="margin-top:20px">Saldo:</h3>
      <div id="saldo" style="font-size:20px;font-weight:700;color:#fff;margin-bottom:15px;">R$ 0,00</div>



      <!-- BOTÃO SUGESTÃO -->
      <div id="sugestaoBox" style="display:none; margin-top:70px;">
        <p>Você gostaria de uma sugestão?</p>
        <button id="btnSugestao" class="btn-sim">SIM</button>
      </div>

      <!-- GRÁFICO -->
      <div class="grafico-container">
        <canvas id="graficoPreview"></canvas>
      </div>


  </main>

  <footer class="bg-white border-t py-1">
    <div class="text-center">
      <p class="text-lg text-gray-500 mb-2">
        Developed by Carol A.<span class="text-red-500 animate-pulse">❤️</span>
      </p>
      <a href="https://github.com/Carolalx" target="_blank" rel="noopener noreferrer" class="github-icon"
        aria-label="GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <path
            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
          </path>
          <path d="M9 18c-4.51 2-5-2-7-2"></path>
        </svg>
      </a>

      <a href="https://www.linkedin.com/in/caroline-a-232a62333/" arget="_blank" rel="noopener noreferrer"
        class="github-icon" aria-label="LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect width="4" height="12" x="2" y="9"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>
    </div>
  </footer>

  <script src="gestao.js"></script>
</body>

</html>
