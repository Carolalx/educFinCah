<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugestão Financeira</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dark">

<header class="app-header">
  <div class="brand">
    <div class="logo">CA</div>
    <div>
      <h1>Gestão Financeira</h1>
      <div style="font-size:12px;color:rgba(230,238,241,0.7)">Sugestão de redistribuição</div>
    </div>
  </div>
  
  <nav class="main-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
    <a href="gestao.html"><i class="fa-solid fa-chart-pie"></i> Gestão</a>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h3>Distribuição Recomendada</h3>
    <div id="tabelaRecomendada"></div>

    <hr>

    <h3>💰 Projeção de Patrimônio</h3>
    <label>Taxa mensal (%):</label>
    <input id="taxaInput" type="number" value="1">
    <div id="projecao" style="margin-top:12px;"></div>

    <!-- INÍCIO: Caixa de investimento do saldo -->
    <div id="investimentoSaldo" style="margin-top:16px; text-align:center;"></div>
    <!-- FIM: Caixa de investimento do saldo -->

    <div style="text-align:center; margin-top:12px;">
      <button id="btnFechar" class="ghost">Fechar</button>
    </div>
  </div>
</main>

<script src="sugestao.js"></script>
</body>
</html>
